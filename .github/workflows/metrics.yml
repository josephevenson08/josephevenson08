name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Validate METRICS_TOKEN
        run: |
          if [ -z "${{ secrets.METRICS_TOKEN }}" ]; then
            echo "::error::METRICS_TOKEN secret is not set. Create a PAT with 'repo' and 'read:packages' scopes and add it as METRICS_TOKEN."
            exit 1
          fi

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
